<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ISO UPNVJ</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; color: #1e40af; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .info {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      color: #0369a1;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">📋</div>
  <h1>Sistem Input Dokumen ISO</h1>
  <p class="subtitle">UPN "Veteran" Jakarta</p>
  
  <div id="g_id_signin_container" style="display:flex;justify-content:center;"></div>
  
  <div class="info">
    🔒 Login hanya untuk email <strong>@upnvj.ac.id</strong><br>
    yang sudah terdaftar oleh admin ISO
  </div>
  
  <div id="message" style="margin-top:16px;"></div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>

<script>
  window.addEventListener('load', function() {
    if (typeof google === 'undefined' || !google.accounts) {
      document.getElementById('message').innerHTML =
        '<div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;font-size:14px;">⚠️ Google Sign-In gagal dimuat. Cek koneksi internet.</div>';
      return;
    }
    
    google.accounts.id.initialize({
      client_id: APP_CONFIG.CLIENT_ID,
      callback: handleCredentialResponse
    });
    
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin_container'),
      { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular' }
    );
  });
</script>

</body>
</html>
